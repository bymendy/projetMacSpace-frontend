<app-navbar></app-navbar>

<section class="content ">

<!-- Contenu principal -->
<div class="container mt-4">
    <h2>Liste des Clients</h2>
    <!-- Tableau pour afficher la liste des clients -->
    <table class="table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Adresse</th>
                <th>Téléphone</th>
                <th>Actions</th> <!-- Ajoutez des boutons d'action ici -->
            </tr>
        </thead>
        <tbody>
            <!-- Les données des clients seront insérées ici dynamiquement -->
        </tbody>
    </table>

    <!-- Bouton pour ajouter un nouveau client -->
    <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#ajouterClientModal">
        Ajouter Client
    </button>

</div>

<!-- Modal pour ajouter un nouveau client -->
<div class="modal fade" id="ajouterClientModal" tabindex="-1" role="dialog" aria-labelledby="ajouterClientModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="ajouterClientModalLabel">Ajouter Nouveau Client</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <!-- Formulaire pour ajouter un nouveau client -->
                <form>
                    <div class="form-group">
                        <label for="nom">Nom</label>
                        <input type="text" class="form-control" id="nom" placeholder="Entrez le nom">
                    </div>
                    <div class="form-group">
                        <label for="prenom">Prénom</label>
                        <input type="text" class="form-control" id="prenom" placeholder="Entrez le prénom">
                    </div>
                    <div class="form-group">
                        <label for="adresse">Adresse</label>
                        <input type="text" class="form-control" id="adresse" placeholder="Entrez l'adresse">
                    </div>
                    <div class="form-group">
                        <label for="telephone">Téléphone</label>
                        <input type="text" class="form-control" id="telephone" placeholder="Entrez le numéro de téléphone">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
                <button type="button" class="btn btn-primary">Enregistrer</button>
            </div>
        </div>
    </div>
</div>
</section>
<app-footer></app-footer>
