<div class="container mb-3">
    <div class="row mb-3">
        <div class="col-12 ">
            <img src="assets/img-produits/motioncam_noir_ajaxsystems.png" class="rounded-circle img-fluid mt-2" width="200px" height="200px" alt="Produit Image">
        </div>
        
    </div>
    <hr>
    <div class="row">
        <div class="col-12 mb-3">
            <h2><i class="fas fa-info-circle orange-color"></i>&nbsp; Informations du produit</h2>
        </div>
        <div class="col-12">
            <form>
                <!-- 1 -->
                <div class="row mb-3">
                    <div class="col-12 col-md-6">
                        <input type="text" class="form-control" placeholder="Code produit">
                    </div>
                    <div class="col-12 col-md-6">
                        <input type="text" class="form-control" placeholder="Désignation">
                    </div>
                </div>
                <!-- 2 -->
                <div class="row mb-3">
                    <div class="col-12 col-md-6">
                        <input type="text" class="form-control" placeholder="Prix unitaire HT">
                    </div>
                    <div class="col-12 col-md-6">
                        <input type="text" class="form-control" placeholder="Taux TVA">
                    </div>
                </div>
                <!-- 3 -->
                <div class="row mb-3">
                    <div class="col-12 col-md-6">
                        <input type="text" class="form-control" placeholder="Prix unitaire TTC">
                    </div>
                    <div class="col-12 col-md-6">
                        <select class="form-control" id="exampleFormControlSelect1">
                            <option>Selectionner une categorie</option>
                            <option>Catégorie 2</option>
                            <option>Catégorie 3</option>
                            <option>Catégorie 4</option>
                            <option>Catégorie 5</option>
                        </select>
                    </div>
                </div>
            </form>
        </div>
        <!-- Boutton Enregistrer et Annuler -->
    <div class="col-md-12 d-flex justify-content-end">
        <button class="btn btn-danger mr-3" (click)="cancel()"> <i class="fas fa-ban "></i>&nbsp; Annuler</button>
        <button class="btn btn-primary"> <i class="fas fa-save "></i>&nbsp; Enregistrer</button>

    </div>
    </div>

    
</div>
