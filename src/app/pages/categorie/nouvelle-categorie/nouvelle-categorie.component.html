<div class="container mb-3 mt-3">
    <div class="row">
      <div class="col-12 mb-3">
        <h2>Nouvelle Categorie</h2>
      </div>
      <div class="col-12">
        <form>
          <!-- 1 -->
          <div class="row mb-3">
            <div class="col-12 col-md-6">
              <input type="text" class="form-control" placeholder="Code Categorie">
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-12 col-md-6">
              <input type="text" class="form-control" placeholder="Description">
            </div>
          </div>
        </form>
      </div>
      <!-- Boutton Enregistrer et Annuler -->
      <div class="col-md-12 d-flex justify-content-end">
        <button class="btn btn-danger mr-3" (click)="cancel()"> 
          <i class="fas fa-ban"></i>&nbsp; Annuler
        </button>
        <button class="btn btn-primary"> 
          <i class="fas fa-save"></i>&nbsp; Enregistrer
        </button>
      </div>
    </div>
  </div>
