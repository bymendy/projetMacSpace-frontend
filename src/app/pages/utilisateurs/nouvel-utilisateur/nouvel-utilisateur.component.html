<!-- NOUVEL UTILISATEUR -->
<div class="container mb-3">
    <div class="row mb-3">
      <div class="col-12">
        <img
          src="assets/img/icon-png-user.png"
          class="rounded-circle img-fluid mt-2"
          width="200px"
          height="200px"
          alt="Produit Image"
        />
      </div>
    </div>
    <hr />
    <div class="row">
      <div class="col-12 mb-3">
        <h2>
          <i class="fas fa-info-circle orange-color"></i>&nbsp; Informations de l'utilisateur
        </h2>
      </div>
      <div class="col-12">
        <form>
          <!-- 1 -->
          <div class="row mb-3">
            <div class="col-12 col-md-6">
              <input type="text" class="form-control" placeholder="Nom" />
            </div>
            <div class="col-12 col-md-6">
              <input type="text" class="form-control" placeholder="Adresse 1" />
            </div>
          </div>
          <!-- 2 -->
          <div class="row mb-3">
            <div class="col-12 col-md-6">
              <input type="text" class="form-control" placeholder="Prenom" />
            </div>
            <div class="col-12 col-md-6">
              <input type="text" class="form-control" placeholder="Fonction" />
            </div>
          </div>
          <!-- 3 -->
          <div class="row mb-3">
            <div class="col-12 col-md-6">
              <input type="text" class="form-control" placeholder="Email" />
            </div>
            <div class="col-12 col-md-6">
              <input type="text" class="form-control" placeholder="Ville" />
            </div>
          </div>
          <!-- 4 -->
          <div class="row mb-3">
            <div class="col-12 col-md-6">
              <input type="text" class="form-control" placeholder="Telephone" />
            </div>
            <div class="col-12 col-md-6">
              <input type="text" class="form-control" placeholder="Code postal" />
            </div>
          </div>
          <!-- 5 -->
          <div class="row mb-3">
            <div class="col">&nbsp;</div>
            <div class="col-12 col-md-6">
              <input type="text" class="form-control" placeholder="Pays" />
            </div>
          </div>
        </form>
      </div>
      <!-- Boutton Enregistrer et Annuler -->
      <div class="col-md-12 d-flex justify-content-end">
        <button class="btn btn-danger mr-3" (click)="cancel()"> 
          <i class="fas fa-ban"></i>&nbsp; Annuler
        </button>
        <button class="btn btn-primary"> 
          <i class="fas fa-save"></i>&nbsp; Enregistrer
        </button>
      </div>
    </div>
  </div>
