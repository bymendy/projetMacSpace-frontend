<div class="container">
  <div class="row m-3">
    <div class="col-md-8 p-0">
      <h1>Commande Fournisseurs</h1>
    </div>
    <div class="col-md-4 text-right">
      <app-button-action (clickEvent)="nouvelleCommande()"></app-button-action>
    </div>
  </div>
  <div class="row m-3">
    <!-- Accordéon -->
    <div class="accordion col-12" id="accordionExample">
      <div class="card">
        <div class="card-header" id="headingOne">
          <h2 class="mb-0">
            <button
              class="btn btn-link btn-block text-left"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#collapseOne"
              aria-expanded="true"
              aria-controls="collapseOne"
            >
              <!-- Détails des produits MVTSTK -->
              <app-cmd-frs></app-cmd-frs>
            </button>
          </h2>
        </div>
        <div
          id="collapseOne"
          class="accordion-collapse collapse show"
          aria-labelledby="headingOne"
          data-bs-parent="#accordionExample"
        >
          <div class="card-body" style="max-height: 300px; overflow-y: scroll">
            <!-- Détails MVTSTK -->
            <app-cmd-details></app-cmd-details>
            <app-cmd-details></app-cmd-details>
            <app-cmd-details></app-cmd-details>
            <app-cmd-details></app-cmd-details>
            <app-cmd-details></app-cmd-details>
          </div>
        </div>
        <!-- TOTAL -->
        <div class="card-footer">
          <div class="row">
            <div class="col-md-6 text-left"><b>6 articles commandés</b> </div>
            <div class="col-md-6 text-right"><b>Total commande : 1006€</b></div>
          </div>
        </div>
      </div>
    </div>
    <!-- ******************************* -->

    <!-- ********************************** -->
  </div>
  <div class="row text-center mb-3">
    <app-pagination></app-pagination>
  </div>
</div>
