<app-navbar></app-navbar>

<section class="content">
  <div class="container mt-5">
    <h2 class="text-center mb-4">Gestion des Interventions</h2>

    <!-- Formulaire pour planifier une intervention -->
    <div class="card mb-4">
      <div class="card-header">Planifier une nouvelle intervention</div>
      <div class="card-body">
        <form id="planifierInterventionForm">
          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="type"></label>
              <input
                type="text"
                class="form-control"
                id="type"
                placeholder="Type d'intervention"
                required
              />
            </div>
            <div class="form-group col-md6">
              <label for="date"></label>
              <input type="date" class="form-control" id="date" required />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group col-md-12">
              <label for="description"></label>
              <textarea
                class="form-control"
                id="description"
                placeholder="Description de l'intervention"
                rows="3"
                required
              ></textarea>
            </div>
          </div>
          <button type="submit" class="btn btn-primary bg-orange my-5">
            Planifier Intervention
          </button>
        </form>
      </div>
    </div>

    <!-- Liste des interventions -->
    <div class="card">
      <div class="card-header">Liste des Interventions</div>
      <div class="card-body">
        <table class="table table-hover">
          <thead>
            <tr>
              <th scope="col">Type</th>
              <th scope="col">Date</th>
              <th scope="col">Description</th>
              <th scope="col">Client</th>
              <th scope="col">Actions</th>
            </tr>
          </thead>
          <tbody id="interventionList">
            <!-- Les lignes des interventions seront insérées ici par JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>
<app-footer></app-footer>
