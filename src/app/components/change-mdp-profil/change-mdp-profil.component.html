<!-- CHANGEMENT MDP PROFIL  -->
<div class="container row m-1">
  <div class="card col-md-6 text-center">
    <div class="col">
      <!-- Image USER -->
      <div class="mb-3 mt-3">
        <img
          src="assets/img/user-icone.png"
          alt="Icone User"
          width="200px"
          height="200px"
        />
      </div>
      <!-- Infos du User -->
      <div class="mb-3">
        <h2>Nom Prenom</h2>
        <small class="form-text text-muted">Adresse, Ville, 91600</small>
      </div>
    </div>
  </div>
  <!-- Formulaire -->
  <div class="card col-md-6">
    <form class="mt-3">
      <div class="form-group mb-2">
        <input
          type="email"
          class="form-control"
          placeholder="Ancien mot de passe"
        />
      </div>
      <div class="form-group">
        <input
          type="password"
          class="form-control mb-2"
          placeholder="Nouveau mot de passe"
        />
      </div>
      <div class="form-group">
        <input
          type="password"
          class="form-control mb-2"
          placeholder="Confirmer mot de passe"
        />
      </div>
    <!-- Boouton Action -->
      <div class="col  d-flex justify-content-end m-2">
        <button class="btn btn-danger " (click)="cancel()">
            <i class="fas fa-ban"></i>&nbsp; Annuler
          </button>
          <button class="btn btn-primary">
            <i class="fas fa-save"></i>&nbsp; Enregistrer
          </button>
    </div>
    </form>
  </div>
</div>
