<!-- NOUVELLE INTER CLIENT-->
<div class="container mb-3">
    <div class="row custom-border p-3">
      <div class="col-12 mb-1">
        <h2>&nbsp; Ticket intervention client</h2>
      </div>
      <div class="row">
        <div class="col-md-5 border-right">
          <!-- Formulaire numero 1 -->
          <form>
            <div class="form-group">
              <input
                type="text"
                class="form-control mb-2"
                placeholder="Numero Intervention"
              />
            </div>
            <div class="form-group">
              <input
                type="text"
                class="form-control mb-2"
                placeholder="Date intervention"
              />
            </div>
            <div class="form-group">
                <input
                  type="text"
                  class="form-control"
                  placeholder="Problematique"
                />
              </div>
            
          </form>
        </div>
        <!-- Informations commande -->
        <div class="col-md-5 border-right">
          <!-- Nom du fournisseur -->
          <div class="row mb-2 align-items-center">
            <div class="col-auto">
              <i class="fas fa-info-circle orange-color"></i>
            </div>
            <div class="col">Nom</div>
          </div>
          <!-- Nom de l'entreprise -->
          <div class="row mb-2 align-items-center">
            <div class="col-auto">
              <i class="fas fa-info-circle orange-color"></i>
            </div>
            <div class="col">Prenom</div>
          </div>
          <!-- Numero de telephone -->
          <div class="row mb-2 align-items-center">
            <div class="col-auto">
              <i class="fa-solid fa-phone orange-color"></i>
            </div>
            <div class="col">Numero de Telephone</div>
          </div>
        <!-- Numero de Contrat -->
          <div class="row mb-2 align-items-center">
            <div class="col-auto">
              <i class="fa-solid fa-file-contract orange-color"></i>
            </div>
            <div class="col">Numero de Contrat</div>
          </div>
          <!-- ETAT (En cours, En attente, Terminee) -->
          <div class="row align-items-center">
            <div class="col-auto">
              <i class="fas fa-hourglass-half orange-color"></i>
            </div>
            <div class="col">EN ATTENTE</div>
          </div>
        </div>
        
        <div class="col-md-2 text-center">
          <!-- Image Client -->
          <img
            src="assets/img/client-vectoriel.jpg"
            class="rounded-circle img-fluid mt-2"
            width="200px"
            height="200px"
            alt="Client Image"
          />
        </div>
      </div>
    </div>
  
  <!-- Formulaire numero 2 -->
  <div class="row mt-2 custom-border ">
    <div class="col-12">
      <form class="d-flex">
        <div class="form-group mr-2 p-1 ">
          <input type="text" class="form-control " placeholder="Numero Intervention">
        </div>
        <div class="form-group mr-2 p-1">
          <input type="text" class="form-control" placeholder="Date">
        </div>
        <div class="form-group p-1">
          <input type="text" class="form-control" placeholder="Problematique">
        </div>
        <div class="col p-1">
          <button type="button" class="btn btn-success"><i class="fas fa-plus"></i></button>
        </div>
      </form>
    </div>
  </div>
  <!-- APP -->
  <div class="row mt-2 p-3 custom-border" style=" max-height: 300px; overflow-y: scroll;">
    <app-inter-details></app-inter-details>
    <app-inter-details></app-inter-details>
    <app-inter-details></app-inter-details>
    <app-inter-details></app-inter-details>
    <app-inter-details></app-inter-details>
    <app-inter-details></app-inter-details>


  </div>

    <div class="col-md-12 d-flex justify-content-end mt-3">
      <button class="btn btn-danger mr-3" (click)="cancel()">
        <i class="fas fa-ban"></i>&nbsp; Annuler
      </button>
      <button class="btn btn-primary">
        <i class="fas fa-save"></i>&nbsp; Enregistrer
      </button>
    </div>
  </div>
